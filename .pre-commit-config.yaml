repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: local
    hooks:
      - id: backend-pylint
        name: backend pylint
        entry: python -m pylint backend/src
        language: system
        pass_filenames: false
      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
