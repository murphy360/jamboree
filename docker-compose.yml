services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8086:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "home-assistant:192.168.68.82"
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
