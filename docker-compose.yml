services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8086:8000"
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "home-assistant:192.168.68.82"
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - backend
